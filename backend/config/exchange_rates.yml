# Fixed, deterministic exchange rates used for cross-country reporting.
# Units of local currency per 1 USD. Changing a value requires running
#   bin/rails salary:recalculate_usd
# so stored USD-equivalents stay consistent. No live FX API is used on purpose.
base: USD
rates:
  USD: 1.0
  EUR: 0.92
  GBP: 0.79
  INR: 83.2
  CAD: 1.36
  AUD: 1.52
  SGD: 1.34
  JPY: 150.0
  BRL: 5.0
