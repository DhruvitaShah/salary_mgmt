# Render Blueprint: one web service (Rails API + Angular UI) and a PostgreSQL database.
databases:
  - name: salary-db
    databaseName: salary_mgmt
    plan: free

services:
  - type: web
    name: salary_mgmt-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salary-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_MAX_THREADS
        value: "5"
